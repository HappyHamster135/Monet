# Monet Setup's USB stick: no menu, straight into Setup. Hold Esc while it
# starts for the menu (basic graphics, for screens that stay black).
set default=0
set timeout_style=hidden
set timeout=2

search --no-floppy --set=root -l '@LABEL@'

menuentry 'Monet Setup' --class monet {
    linux /images/pxeboot/vmlinuz root=live:CDLABEL=@LABEL@ rd.live.image rd.live.overlay.overlayfs=1 quiet splash loglevel=3 rd.udev.log_level=3 nouveau.modeset=0 enforcing=0
    initrd /images/pxeboot/initrd.img
}

menuentry 'Monet Setup with basic graphics' --class monet {
    linux /images/pxeboot/vmlinuz root=live:CDLABEL=@LABEL@ rd.live.image rd.live.overlay.overlayfs=1 quiet splash nomodeset enforcing=0
    initrd /images/pxeboot/initrd.img
}
