# Monet's installer. Anaconda reads conf.d after Fedora's profile, so these
# win over it (a product.d file is never read).

[User Interface]
# Monet's look: the painting, paper pages, lily choices, the sun to go ahead.
custom_stylesheet = /usr/share/anaconda/pixmaps/monet.css

# Monet locks root. Its account spokes require a usable administrator before
# installation starts.
hidden_spokes =
    PasswordSpoke
    UserSpoke
