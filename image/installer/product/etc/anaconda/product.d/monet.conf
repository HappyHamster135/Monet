# Monet's installer: Fedora's installer with Monet's name, look, and fewer
# screens. Everything not set here comes from Fedora.

[Product]
product_name = Monet

[Base Product]
product_name = Fedora

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/monet.css

# Root's password: Monet locks the root account, and the person
# installing becomes the administrator.
hidden_spokes =
    PasswordSpoke
