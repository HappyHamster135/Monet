<svg xmlns="http://www.w3.org/2000/svg" width="40" height="8" viewBox="0 0 40 8">
  <!-- Plasma asks for these elements to mark panel padding in edit mode.
       Retain their geometry, while showing only the actual Monet surfaces. -->
  <g opacity="0">
    <rect id="fill" x="0" y="0" width="8" height="8"/>
    <rect id="topleft" x="8" y="0" width="8" height="8"/>
    <rect id="topright" x="16" y="0" width="8" height="8"/>
    <rect id="bottomleft" x="24" y="0" width="8" height="8"/>
    <rect id="bottomright" x="32" y="0" width="8" height="8"/>
  </g>
</svg>
