    <path d="M29.0 58.2 Q64 50.4 107.1 52.2" stroke="#FFFFFF" stroke-opacity="0.051" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <path d="M29.9 77.3 Q64 73.3 123.3 71.3" stroke="#FFFFFF" stroke-opacity="0.036" stroke-width="13.1" stroke-linecap="round" fill="none"/>
    <path d="M29.6 97.4 Q64 89.0 100.5 91.4" stroke="#FFFFFF" stroke-opacity="0.049" stroke-width="7.2" stroke-linecap="round" fill="none"/>
