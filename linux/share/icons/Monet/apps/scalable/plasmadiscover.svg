    <path d="M25.0 66.6 Q64 58.7 103.1 60.6" stroke="#FFFFFF" stroke-opacity="0.037" stroke-width="9.7" stroke-linecap="round" fill="none"/>
    <path d="M10.7 78.0 Q64 72.3 115.2 72.0" stroke="#FFFFFF" stroke-opacity="0.068" stroke-width="12.8" stroke-linecap="round" fill="none"/>
    <path d="M29.6 96.6 Q64 88.5 109.9 90.6" stroke="#FFFFFF" stroke-opacity="0.057" stroke-width="12.9" stroke-linecap="round" fill="none"/>
    <circle cx="64" cy="64" r="56" fill="url(#shade)"/>
