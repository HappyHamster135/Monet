    <path d="M7.5 39.4 Q64 35.1 101.8 33.4" stroke="#FFFFFF" stroke-opacity="0.105" stroke-width="10.1" stroke-linecap="round" fill="none"/>
    <path d="M29.1 63.1 Q64 58.5 114.8 57.1" stroke="#FFFFFF" stroke-opacity="0.066" stroke-width="13.3" stroke-linecap="round" fill="none"/>
    <path d="M23.2 77.6 Q64 72.2 110.1 71.6" stroke="#FFFFFF" stroke-opacity="0.033" stroke-width="9.8" stroke-linecap="round" fill="none"/>
    <path d="M15.2 102.1 Q64 97.8 119.8 96.1" stroke="#FFFFFF" stroke-opacity="0.051" stroke-width="12.7" stroke-linecap="round" fill="none"/>
    <circle cx="64" cy="64" r="56" fill="url(#shade)"/>
  </g>
  <circle cx="64" cy="64" r="55.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <path d="M38 52 h52 M38 76 h52 M54 44 v16 M76 68 v16" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
