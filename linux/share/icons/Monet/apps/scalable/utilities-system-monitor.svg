<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Monet icon: monitor. A pebble glazed like the paintings, a white line drawing on top. -->
  <defs>
    <linearGradient id="glaze" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5C88D0"/>
      <stop offset="1" stop-color="#294985"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pebble"><circle cx="64" cy="64" r="56"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="56" fill="url(#glaze)"/>
  <g clip-path="url(#pebble)">
    <path d="M19.3 19.8 Q64 13.2 121.3 13.8" stroke="#FFFFFF" stroke-opacity="0.109" stroke-width="11.1" stroke-linecap="round" fill="none"/>
    <path d="M9.5 42.1 Q64 34.9 104.2 36.1" stroke="#FFFFFF" stroke-opacity="0.100" stroke-width="12.2" stroke-linecap="round" fill="none"/>
    <path d="M12.6 62.8 Q64 52.8 104.8 56.8" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="12.8" stroke-linecap="round" fill="none"/>
    <path d="M4.6 81.6 Q64 72.3 103.1 75.6" stroke="#FFFFFF" stroke-opacity="0.043" stroke-width="10.6" stroke-linecap="round" fill="none"/>
    <path d="M14.6 100.2 Q64 91.8 118.6 94.2" stroke="#FFFFFF" stroke-opacity="0.057" stroke-width="7.7" stroke-linecap="round" fill="none"/>
    <circle cx="64" cy="64" r="56" fill="url(#shade)"/>
  </g>
  <circle cx="64" cy="64" r="55.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <path d="M36 66 h14 l7 -16 l12 30 l8 -18 h15" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
