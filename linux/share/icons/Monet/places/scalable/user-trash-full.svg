    <path d="M6.5 66.4 Q64 61.1 115.5 60.4" stroke="#FFFFFF" stroke-opacity="0.046" stroke-width="8.8" stroke-linecap="round" fill="none"/>
    <path d="M12.4 81.5 Q64 72.0 103.1 75.5" stroke="#FFFFFF" stroke-opacity="0.032" stroke-width="8.2" stroke-linecap="round" fill="none"/>
    <path d="M23.1 100.2 Q64 93.1 118.1 94.2" stroke="#FFFFFF" stroke-opacity="0.051" stroke-width="9.1" stroke-linecap="round" fill="none"/>
