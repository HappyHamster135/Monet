# The Store's front page (Bazaar's curated page): Monet's picks, each row
# under a strip of The Hours, by daylight in Mist and by night in Smoke
# (tools/make-store.py cuts them). Installed over Bazzite's page.
rows:
  - banner:
      height: 300
      image:
        uri: file://@DATADIR@/monet/store/play-mist.jpg
        light-uri: file://@DATADIR@/monet/store/play-mist.jpg
        dark-uri: file://@DATADIR@/monet/store/play-smoke.jpg
        fit: cover
        can-shrink: true
        alt: "Play"
  - section:
      title: "Play"
      subtitle:
        string: "Launchers, old consoles and new games. Steam is already here."
      appids:
        list:
          - com.heroicgameslauncher.hgl
          - io.itch.itch
          - org.prismlauncher.PrismLauncher
          - org.vinegarhq.Sober
          - org.libretro.RetroArch
          - net.retrodeck.retrodeck
          - org.DolphinEmu.dolphin-emu
          - net.pcsx2.PCSX2
          - net.rpcs3.RPCS3
          - org.ppsspp.PPSSPP
          - info.cemu.Cemu
          - org.scummvm.ScummVM
          - sh.ppy.osu
          - net.supertuxkart.SuperTuxKart

  - banner:
      height: 300
      image:
        uri: file://@DATADIR@/monet/store/talk-mist.jpg
