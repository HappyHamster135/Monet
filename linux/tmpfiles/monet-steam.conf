# Steam offers /var/tmp as a drive for a new library: its own container (pressure-vessel)
# shares the PC's /var/tmp as a place of its own, which Monet can't change. Games put there
# would be cleared away a month after they were last used, as everything left in /var/tmp is;
# the library Steam makes there is kept instead.
x /var/tmp/SteamLibrary
