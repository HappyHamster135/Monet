# When memory runs out, every program keeps the pages it used within the last second (MGLRU's
# min_ttl_ms, as ChromeOS sets it), so the PC doesn't freeze for minutes passing its working set
# in and out of swap; the out-of-memory handling acts instead. Ignored by kernels without MGLRU.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
