# Monet: just before Steam starts with the session, its libraries on the PC's other drives are
# found again where the drives are mounted now, once the PC has mounted them (monet-quick
# steam-drives wait), and Windows' Games folder goes into its libraries (monet-quick steam-share;
# nothing when Windows' drive isn't shared this time). Steam writes its own files back as it
# quits, so they can only change while it's closed.
[Service]
ExecStartPre=-@LIBEXECDIR@/monet-quick steam-drives wait
ExecStartPre=-@LIBEXECDIR@/monet-quick steam-share
