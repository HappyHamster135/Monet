[Service]
# This stateless Bluetooth media-control bridge can hang while players and
# BlueZ disappear at shutdown. Give it time to exit normally, then finish
# stopping it without Fedora's SIGABRT/core-dump timeout path. This limit
# applies only to the proxy, not Bluetooth itself or apps saving user data.
TimeoutStopSec=3s
TimeoutStopFailureMode=kill
