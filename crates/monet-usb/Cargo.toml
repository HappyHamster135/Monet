[package]
name = "monet-usb"
description = "Makes a Monet USB stick on Windows: downloads Monet's installer and writes it to a USB stick"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monet-usb"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
