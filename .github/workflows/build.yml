name: Build

# Every push is built and tested. On the default branch, a new version in
# VERSION is published as a GitHub release automatically, together with the
# Monet OS image and its installer ISO. A push to the branch named beta
# (git push origin HEAD:beta) publishes that version as its next beta instead
# (tools/beta-release.py): its own image and release tags only, never :latest.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keep the package baseline deliberate while ubuntu-latest moves to Ubuntu 26.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Native storage test tools
        run: |
          tools/configure-ci-apt.sh
          sudo apt-get update -q
          sudo apt-get install -y -q cryptsetup-bin fdisk ntfs-3g dosfstools wimtools
      - name: Tests
        run: cargo test --workspace
      - name: Windows discovery and encrypted-drive retry at boot
        run: sudo unshare --mount --propagation private --fork sh -ec 'mount -t tmpfs tmpfs /run; python3 tests/fixtures/windows-boot-probe.py target/debug/monet'
      - name: Read-only boot cleanup in a private mount namespace
        run: sudo unshare --mount --propagation private --fork python3 tests/fixtures/seal-boot-mount.py
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shell scripts
        run: for f in linux/install.sh linux/uninstall.sh linux/libexec/monet-session linux/libexec/monet-look linux/libexec/monet-light linux/libexec/monet-charge tools/configure-ci-apt.sh tools/package.sh tools/push-image.sh tools/build-settings-style.sh image/finish-image.sh image/*/build.sh image/setup/monet-trust image/setup/files/usr/libexec/monet-setup-session; do bash -n "$f"; done
      - name: Python helpers
        run: python3 -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' linux/libexec/monet-quick linux/libexec/monet-startup linux/libexec/monet-storage-recovery linux/libexec/monet-files-tools linux/libexec/monet-system-info linux/libexec/monet-resume linux/libexec/monet-leave linux/libexec/monet-files-session linux/libexec/monet-editor-session linux/libexec/monet-pdf-session linux/libexec/monet-browser-session linux/libexec/monet-bookmarks linux/libexec/monet-ready linux/libexec/monet-keep linux/libexec/monet-boot linux/libexec/monet-reset linux/libexec/monet-seal linux/libexec/monet-pairings linux/libexec/monet-secure linux/libexec/monet-windows-drive linux/libexec/monet-paint linux/libexec/monet-guest linux/libexec/monet-games linux/libexec/monet-settings linux/libexec/monet-store linux/libexec/monet-store-jobs linux/libexec/monet-profile linux/libexec/monet-passwords linux/libexec/monet-passwords-browser linux/libexec/monet-priority linux/libexec/monet-game-keys linux/libexec/monet-boot-network linux/share/monet/passwords/*.py tools/*.py setup/monet-setup setup/monet_setup/*.py image/*/*.py image/installer/product/usr/libexec/monet-download
      - name: Installer tests
        run: |
          # GTK 3, to check the installer's stylesheet the way Anaconda loads it.
          sudo apt-get install -y -q gir1.2-gtk-3.0 python3-gi python3-nacl dbus-daemon dbus-bin
          python3 tools/test.py

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native Qt and KDE test runtime
        run: |
          # KWin's virtual display uses CPU rendering through udmabuf. The
          # container still has no physical GPU, input devices or host session.
          # UDMABUF is built into the kernel, not a loadable module.
          if [ ! -c /dev/udmabuf ]; then
            IFS=: read -r monet_buffer_major monet_buffer_minor < /sys/class/misc/udmabuf/dev
            sudo mknod /dev/udmabuf c "$monet_buffer_major" "$monet_buffer_minor"
          fi
          sudo chown "$(id -u):$(id -g)" /dev/udmabuf
          podman build -f tests/Containerfile -t localhost/monet-desktop-tests:44 .
      - name: Pinned browser test input (the builder verifies its SHA-256)
        run: |
          mkdir -p target/desktop-tests
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            https://addons.mozilla.org/firefox/downloads/file/5078406/keepassxc_browser-1.10.4.1.xpi \
            -o target/desktop-tests/upstream.xpi
      - name: Required desktop tests (private home, bus and sound server)
        run: |
          mkdir -p target/desktop-tests
          podman run --rm --init --userns=keep-id --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --device=/dev/udmabuf \
            -v "$PWD:/src:ro" -v "$PWD/target/desktop-tests:/results" \
            -e MONET_TEST_BROWSER_UPSTREAM=/results/upstream.xpi \
            localhost/monet-desktop-tests:44 \
            python3 tools/test.py --require-desktop --summary /results/summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-test-results
          path: target/desktop-tests/summary.json
          if-no-files-found: warn

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (version from rust-toolchain.toml)
        run: |
          tools/configure-ci-apt.sh
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 cmake qt6-base-dev libwayland-dev libwayland-bin python3-pip
          rustup toolchain install && rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
      - name: Build
        run: |
          cargo build --release -p monet --target x86_64-unknown-linux-musl
          cargo build --release -p monet-bridge -p monet-setup-check --target x86_64-pc-windows-gnu
          cargo build --release -p monet-usb --target x86_64-pc-windows-gnu
      - name: Package
        run: |
          VERSION=$(cat VERSION)
          tools/package.sh linux target/x86_64-unknown-linux-musl/release/monet "dist/monet-$VERSION-linux" \
            target/x86_64-pc-windows-gnu/release/monet-bridge.exe \
            target/x86_64-pc-windows-gnu/release/monet-setup-check.exe
          tar -C dist -czf "dist/Monet-$VERSION-Linux.tar.gz" "monet-$VERSION-linux"
      - name: Make a Monet USB stick (Windows)
        run: cp target/x86_64-pc-windows-gnu/release/monet-usb.exe "dist/Monet-$(cat VERSION)-Make-USB-Stick.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-usb
          path: dist/*.exe
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: cargo build --release -p monet-bridge -p monet-usb -p monet-setup-check
      - name: Windows bridge, USB and setup identity tests (temporary files and simulated disks)
        run: cargo test -p monet-bridge -p monet-usb -p monet-setup-check
      - name: Lint
        run: cargo clippy -p monet-bridge -p monet-usb -p monet-setup-check --all-targets -- -D warnings
      - name: Check PowerShell scripts
        shell: pwsh
        run: ./tools/check-powershell.ps1
      - name: Package
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          tools/package.sh windows target/release/monet-bridge.exe "dist/Monet for Windows"
          pwsh -NoProfile -Command "Compress-Archive -Path 'dist/Monet for Windows' -DestinationPath 'dist/Monet-$VERSION-Windows.zip'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  check:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
      promote: ${{ steps.beta.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for a new version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # A published beta of this same source is released as it was tested: its signed
      # images, not a new build. Without one, the images are built as always.
      - name: A beta of this same source
        id: beta
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/beta-release.py promotion

  os:
    needs: [test, desktop, check]
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/image.yml
    with:
      promote: ${{ needs.check.outputs.promote }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: write

  release:
    needs: [test, desktop, check, linux, windows, os]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only what's meant for people: test screenshots and builds that
      # didn't pass their tests have other names.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Two pushes close together can both see a new version: one releases.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          # This version's notes only: every version's at once made the Releases page slow.
          python3 tools/release-notes.py RELEASE_NOTES.md > this-release.md
          gh release create "v$VERSION" dist/* \
            --title "Monet $VERSION" \
            --notes-file this-release.md \
            --prerelease \
            --target "$GITHUB_SHA"

  # A beta: the version in VERSION, pushed to the beta branch, once its general and desktop
  # checks pass. Its number is kept as its git tag first (v0.9.8-7-beta.1), so a push
  # after it, or one that stopped halfway, makes the next one.
  beta:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/beta'
    needs: [test, desktop]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.number.outputs.version }}
      number: ${{ steps.number.outputs.number }}
      tag: ${{ steps.number.outputs.tag }}
      release: ${{ steps.number.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The next beta number
        id: number
        run: python3 tools/beta-release.py reserve

  # The same images, signed the same way, under the beta's own tag only; the same
  # installers (which keep a PC on the beta) and the same install test in a VM.
  beta-os:
    needs: [beta]
    uses: ./.github/workflows/image.yml
    with:
      beta: ${{ needs.beta.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      actions: read
      packages: write

  beta-release:
    needs: [beta, linux, windows, beta-os]
    runs-on: ubuntu-24.04
    # One at a time, so the newest beta is always the one published last.
    concurrency:
      group: monet-beta-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.beta.outputs.version }}
          NUMBER: ${{ needs.beta.outputs.number }}
          RELEASE: ${{ needs.beta.outputs.release }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/monet-registry-auth.json
        run: |
          # A newer beta, or this version's release, came out while this one was building.
          status=0
          python3 tools/beta-release.py newest "$VERSION" "$NUMBER" || status=$?
          if [ "$status" = 3 ]; then exit 0; elif [ "$status" != 0 ]; then exit "$status"; fi
          tools/configure-ci-apt.sh
          sudo apt-get update -q
          sudo apt-get install -y -q skopeo
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            cd dist && sha256sum * > SHA256SUMS.txt && cd ..
            python3 tools/beta-release.py notes "$VERSION" "$NUMBER" RELEASE_NOTES.md > this-release.md
            gh release create "$RELEASE" dist/* \
              --title "Monet $VERSION beta $NUMBER" \
              --notes-file this-release.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          # Then :beta, which installed Monets offer from: only a whole beta, with its release.
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monet"
          python3 tools/beta-release.py publish "$VERSION" "$NUMBER" "$IMAGE" "$IMAGE-amd"
