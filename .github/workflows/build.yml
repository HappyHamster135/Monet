name: Build

# Every push is built and tested. On the default branch, a new version in
# VERSION is published as a GitHub release automatically, together with the
# Monet OS image and its installer ISO.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Tests
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shell scripts
        run: for f in linux/install.sh linux/uninstall.sh linux/libexec/monet-session linux/libexec/monet-look linux/libexec/monet-light linux/libexec/monet-charge tools/package.sh image/setup/build.sh image/setup/monet-trust image/setup/files/usr/libexec/monet-setup-session; do bash -n "$f"; done
      - name: Python helpers
        run: python3 -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' linux/libexec/monet-quick linux/libexec/monet-ready linux/libexec/monet-keep linux/libexec/monet-boot linux/libexec/monet-reset linux/libexec/monet-seal linux/libexec/monet-pairings tools/*.py setup/monet-setup setup/monet_setup/*.py image/installer/product/usr/libexec/monet-download
      - name: Installer tests
        run: |
          # GTK 3, to check the installer's stylesheet the way Anaconda loads it.
          sudo apt-get install -y -q gir1.2-gtk-3.0 python3-gi >/dev/null
          python3 -m unittest discover -s tests -v

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version from rust-toolchain.toml)
        run: |
          sudo apt-get install -y -q mingw-w64 >/dev/null
          rustup toolchain install && rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
      - name: Build
        run: |
          cargo build --release -p monet --target x86_64-unknown-linux-musl
          cargo build --release -p monet-bridge --target x86_64-pc-windows-gnu
          cargo build --release -p monet-usb --target x86_64-pc-windows-gnu
      - name: Package
        run: |
          VERSION=$(cat VERSION)
          tools/package.sh linux target/x86_64-unknown-linux-musl/release/monet "dist/monet-$VERSION-linux" \
            target/x86_64-pc-windows-gnu/release/monet-bridge.exe
          tar -C dist -czf "dist/Monet-$VERSION-Linux.tar.gz" "monet-$VERSION-linux"
      - name: Make a Monet USB stick (Windows)
        run: cp target/x86_64-pc-windows-gnu/release/monet-usb.exe "dist/Monet-$(cat VERSION)-Make-USB-Stick.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-usb
          path: dist/*.exe

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: cargo build --release -p monet-bridge
      - name: Lint
        run: cargo clippy -p monet-bridge -- -D warnings
      - name: Check PowerShell scripts
        shell: pwsh
        run: ./tools/check-powershell.ps1
      - name: Package
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          tools/package.sh windows target/release/monet-bridge.exe "dist/Monet for Windows"
          pwsh -NoProfile -Command "Compress-Archive -Path 'dist/Monet for Windows' -DestinationPath 'dist/Monet-$VERSION-Windows.zip'"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip

  check:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for a new version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  os:
    needs: [test, check]
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  release:
    needs: [check, linux, windows, os]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only what's meant for people: test screenshots and builds that
      # didn't pass their tests have other names.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Two pushes close together can both see a new version: one releases.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          # This version's notes only: every version's at once made the Releases page slow.
          python3 tools/release-notes.py RELEASE_NOTES.md > this-release.md
          gh release create "v$VERSION" dist/* \
            --title "Monet $VERSION" \
            --notes-file this-release.md \
            --prerelease \
            --target "$GITHUB_SHA"
