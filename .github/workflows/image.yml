name: Monet OS

# Builds the Monet OS image (Bazzite with Monet built in), pushes it to
# GitHub Packages, and builds the installer ISO that installs it.
#
# Runs as part of every release, weekly to rebuild the released version with
# Bazzite's updates, and by hand from the Actions tab (that builds main).
on:
  workflow_call:
    secrets:
      MONET_SIGNING_KEY:
        required: false
      MONET_SIGNING_PASSPHRASE:
        required: false
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref_name != 'codex/monet-0.9.8-5-vm-test'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.build.outputs.image }}
      fedora: ${{ steps.build.outputs.fedora }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Make room (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The released Monet (the weekly rebuild never ships unreleased work)
        if: github.event_name == 'schedule'
        run: git fetch --depth=1 origin "refs/tags/v$(cat VERSION)" && git checkout FETCH_HEAD
      - name: Build
        id: build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monet"
          VERSION=$(cat VERSION)
          sudo podman build -f image/Containerfile --build-arg VERSION="$VERSION" -t "$IMAGE:latest" -t "$IMAGE:$VERSION" .
          FEDORA=$(sudo podman run --rm --entrypoint rpm "$IMAGE:latest" -E %fedora)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "fedora=$FEDORA" >> "$GITHUB_OUTPUT"
          echo "Built $IMAGE $VERSION on Fedora $FEDORA"
      # bootc reads its install settings (prepare-root.conf, install/*.toml) from the
      # system it runs on, not from the image it installs: Monet Setup's USB stick
      # carries this image's own (image/setup/build.sh).
      - name: bootc's install settings, for Monet Setup
        continue-on-error: true
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          sudo podman run --rm --entrypoint sh "$IMAGE:latest" -c 'cd / && tar -cf - $(ls -d usr/lib/ostree/prepare-root.conf etc/ostree/prepare-root.conf usr/lib/bootc/install usr/lib/bootc/bound-images.d 2>/dev/null)' > bootc-settings.tar
          tar -tvf bootc-settings.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: bootc-settings
          path: bootc-settings.tar
          if-no-files-found: error
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ hashFiles('image/monet-update.pub') != '' }}
      - name: Install the image signing transport
        if: ${{ hashFiles('image/monet-update.pub') != '' }}
        run: sudo apt-get install -y -q skopeo
      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          MONET_SIGNING_KEY: ${{ secrets.MONET_SIGNING_KEY }}
          MONET_SIGNING_PASSPHRASE: ${{ secrets.MONET_SIGNING_PASSPHRASE }}
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash tools/push-image.sh "$IMAGE" "$(cat VERSION)" "$GITHUB_OUTPUT"

  # The same Monet on Bazzite's AMD and Intel desktop (Mesa, no NVIDIA driver):
  # for Radeon and Intel graphics, and older GeForce cards. Built beside the other.
  image-amd:
    if: github.ref_name != 'codex/monet-0.9.8-5-vm-test'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Make room (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The released Monet (the weekly rebuild never ships unreleased work)
        if: github.event_name == 'schedule'
        run: git fetch --depth=1 origin "refs/tags/v$(cat VERSION)" && git checkout FETCH_HEAD
      - name: Build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monet-amd"
          VERSION=$(cat VERSION)
          sudo podman build -f image/Containerfile --build-arg BASE=ghcr.io/ublue-os/bazzite:stable --build-arg VERSION="$VERSION" \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ hashFiles('image/monet-update.pub') != '' }}
      - name: Install the image signing transport
        if: ${{ hashFiles('image/monet-update.pub') != '' }}
        run: sudo apt-get install -y -q skopeo
      - name: Push
        id: push
        env:
          MONET_SIGNING_KEY: ${{ secrets.MONET_SIGNING_KEY }}
          MONET_SIGNING_PASSPHRASE: ${{ secrets.MONET_SIGNING_PASSPHRASE }}
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash tools/push-image.sh "$IMAGE" "$(cat VERSION)" "$GITHUB_OUTPUT"

  iso:
    needs: [image, image-amd]
    if: github.event_name != 'schedule' && needs.image.outputs.digest != '' && needs.image-amd.outputs.digest != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The released Monet (the weekly rebuild never ships unreleased work)
        if: github.event_name == 'schedule'
        run: git fetch --depth=1 origin "refs/tags/v$(cat VERSION)" && git checkout FETCH_HEAD
      - name: Download the Fedora network installer
        env:
          FEDORA: ${{ needs.image.outputs.fedora }}
        run: |
          for F in "$FEDORA" $((FEDORA - 1)); do
            BASE="https://dl.fedoraproject.org/pub/fedora/linux/releases/$F/Everything/x86_64/iso/"
            NAME=$(curl -fsSL "$BASE" | grep -o "Fedora-Everything-netinst-x86_64-$F-[0-9.]*\.iso" | head -1 || true)
            if [ -n "$NAME" ]; then
              echo "Using $NAME"
              curl -fL --retry 3 -o netinst.iso "$BASE$NAME"
              echo "FEDORA_ISO=$F" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Fedora network installer found" >&2
          exit 1
      - name: Build the Monet installer
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          NVIDIA_DIGEST: ${{ needs.image.outputs.digest }}
          AMD_DIGEST: ${{ needs.image-amd.outputs.digest }}
        run: |
          VERSION=$(cat VERSION)
          printf '{"%s:%s":"%s","%s-amd:%s":"%s"}\n' \
            "$IMAGE" "$VERSION" "$NVIDIA_DIGEST" "$IMAGE" "$VERSION" "$AMD_DIGEST" > image-digests.json

          # Monet's look for the installer, loaded automatically from /images/product.img.
          rm -rf product && cp -r image/installer/product product
          sed -i -e "s|@VERSION@|$VERSION|" -e "s|@UUID@|$(date -u +%Y%m%d%H%M).x86_64|" product/.buildstamp

          # 1. Monet's start menu and look, 2. Monet's kickstart. mkksiso goes
          # last: it rebuilds the EFI boot image from the edited menu and
          # /EFI/BOOT (that copy is what PCs actually boot), renames the stick
          # and adds the media checksum.
          docker run --rm --privileged -v "$PWD:/work" -w /work -e VERSION="$VERSION" -e MONET_FALLBACK_IMAGE="$IMAGE:$VERSION" "registry.fedoraproject.org/fedora:$FEDORA_ISO" bash -ec "
            dnf -y -q install lorax xorriso isomd5sum mtools python3 cpio diffutils
            PYTHONPATH=setup python3 -m monet_setup.trust \"\$MONET_FALLBACK_IMAGE\" monet.ks image-digests.json --kickstart image/monet.ks
            OLD=\$(xorriso -indev netinst.iso -pvd_info 2>/dev/null | sed -n 's/^Volume Id *: *//p' | tr -d \"'\" | xargs)
            NEW=Monet-\$VERSION
            test -n \"\$OLD\"
            echo \"Volume label: \$OLD -> \$NEW\"
            xorriso -osirrox on -indev netinst.iso -extract /EFI/BOOT/grub.cfg efi.cfg -extract /boot/grub2/grub.cfg bios.cfg \
              -extract /images/pxeboot/initrd.img initrd.img
            # The menus find the stick by its label: Monet's from now on.
            sed -i \"s|\$OLD|\$NEW|g\" efi.cfg bios.cfg
            python3 tools/patch-grub.py efi.cfg bios.cfg
            (cd product && find . | cpio --quiet -c -o | gzip -9) > product.img
            # Early boot says Monet too: the initrd's own .buildstamp, overridden
            # by a small archive appended to it.
            rm -rf stamp && mkdir stamp && cp product/.buildstamp stamp/.buildstamp
            (cd stamp && echo .buildstamp | cpio --quiet -o -H newc) > stamp.cpio
            cat initrd.img stamp.cpio > initrd-monet.img
            xorriso -indev netinst.iso -outdev branded.iso -boot_image any replay \
              -update efi.cfg /EFI/BOOT/grub.cfg -update efi.cfg /EFI/BOOT/BOOT.conf \
              -update bios.cfg /boot/grub2/grub.cfg -map product.img /images/product.img \
              -update initrd-monet.img /images/pxeboot/initrd.img -map image/installer/grub /EFI/BOOT/monet
            mkksiso -V \"\$NEW\" --ks monet.ks branded.iso Monet-\$VERSION-Installer.iso
            checkisomd5 Monet-\$VERSION-Installer.iso
            # Check the menu in both places, especially the (hidden) EFI boot image.
            rm -rf bootimgs && mkdir bootimgs
            xorriso -osirrox on -indev Monet-\$VERSION-Installer.iso \
              -extract /EFI/BOOT/grub.cfg check.cfg -extract /EFI/BOOT/monet/theme.txt check-theme.txt \
              -extract /images/pxeboot/initrd.img check-initrd.img -extract_boot_images bootimgs/
            grep -q 'Install Monet and Windows' check.cfg
            grep -q 'inst.pauseatsummary' check.cfg
            grep -q \"search .*'\$NEW'\" check.cfg
            grep -q 'monet/theme.txt' check.cfg
            grep -q 'boot_menu' check-theme.txt
            xorriso -indev Monet-\$VERSION-Installer.iso -pvd_info 2>/dev/null | grep -q \"\$NEW\"
            cmp -s <(tail -c \$(stat -c %s stamp.cpio) check-initrd.img) stamp.cpio
            for img in bootimgs/*uefi*; do
              if mtype -i \"\$img\" ::/EFI/BOOT/grub.cfg > efiboot.cfg 2>/dev/null; then
                if grep -q menuentry efiboot.cfg && ! grep -q 'Install Monet and Windows' efiboot.cfg; then
                  echo 'The EFI boot image still has the old menu' >&2
                  exit 1
                fi
                if grep -q menuentry efiboot.cfg && ! grep -q 'inst.pauseatsummary' efiboot.cfg; then
                  echo 'The EFI boot image does not pause for install confirmation' >&2
                  exit 1
                fi
                echo \"EFI boot image menu: \$(grep -c menuentry efiboot.cfg) entries, Monet's menu\"
              fi
            done
            rm -rf branded.iso bootimgs
          "
          sudo chown "$(id -u)" "Monet-$VERSION-Installer.iso"
          ls -lh "Monet-$VERSION-Installer.iso"
      - name: Check that Microsoft's Windows download still answers
        # Informational: Microsoft often blocks data centers, so a failure
        # here doesn't mean it fails at home.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import importlib.machinery, importlib.util
          loader = importlib.machinery.SourceFileLoader("pw", "linux/libexec/monet-prepare-windows")
          spec = importlib.util.spec_from_loader("pw", loader)
          pw = importlib.util.module_from_spec(spec)
          loader.exec_module(pw)
          pw.LOG = pw.Path("/tmp/pw.log")
          uri, lang = pw.windows_download_link("English")
          print("Microsoft offered:", lang, uri.split("?")[0])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-iso
          path: Monet-*-Installer.iso
          if-no-files-found: error
          compression-level: 0

  # Monet Setup: Monet's own installer, on a small live Fedora (image/setup).
  # It's released only after it has installed Monet in a VM (setup-vm).
  setup:
    needs: [image, image-amd]
    if: github.event_name != 'schedule' && needs.image.outputs.digest != '' && needs.image-amd.outputs.digest != ''
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The released Monet (the weekly rebuild never ships unreleased work)
        if: github.event_name == 'schedule'
        run: git fetch --depth=1 origin "refs/tags/v$(cat VERSION)" && git checkout FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootc-settings
      - name: Build Monet Setup's USB stick
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          FEDORA: ${{ needs.image.outputs.fedora }}
          NVIDIA_DIGEST: ${{ needs.image.outputs.digest }}
          AMD_DIGEST: ${{ needs.image-amd.outputs.digest }}
        run: |
          VERSION=$(cat VERSION)
          printf '{"%s:%s":"%s","%s-amd:%s":"%s"}\n' \
            "$IMAGE" "$VERSION" "$NVIDIA_DIGEST" "$IMAGE" "$VERSION" "$AMD_DIGEST" > image-digests.json
          docker run --rm --privileged -v "$PWD:/work" -w /work "registry.fedoraproject.org/fedora:$FEDORA" \
            image/setup/build.sh "$VERSION" "$IMAGE:$VERSION" "/work/Monet-$VERSION-Setup.iso" \
            /work/bootc-settings.tar /work/image-digests.json
          sudo chown "$(id -u)" Monet-*-Setup.iso
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-candidate
          path: Monet-*-Setup.iso
          if-no-files-found: error
          compression-level: 0

  setup-vm:
    needs: setup
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The released Monet (the weekly rebuild never ships unreleased work)
        if: github.event_name == 'schedule'
        run: git fetch --depth=1 origin "refs/tags/v$(cat VERSION)" && git checkout FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup-candidate
      - name: A virtual machine with Secure Boot
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf qemu-utils python3-pil
      # Then signs in and looks around: desktop, app menu, Files, Settings,
      # and the lock screen, unlocked with the password.
      - name: Install Monet with Monet Setup, then look around it
        run: |
          set +e -o pipefail
          python3 tools/vm-test.py Monet-*-Setup.iso screens --install | tee vm-test.log
          code=$?
          # 6: Setup installed Monet, but Continue boot on the blue screen didn't bring it back.
          # Setup still ships (a skipped blue screen is then as it was before the fallback),
          # and the summary says so.
          [ "$code" = 6 ] && exit 0
          exit "$code"
      - name: Keep the screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci-screens.py push screens "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monet:ci-screens" || :
          grep -E '^(fallback|stick|monet|tour):' vm-test.log >> "$GITHUB_STEP_SUMMARY" || :
          # The whole serial log (every start's journal, Setup's install log among them) with the screenshots.
          cp vm-work/serial.log screens/ || :
          tail -c 20000 vm-work/serial.log || :
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: setup-screens
          path: screens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-setup
          path: Monet-*-Setup.iso
          if-no-files-found: error
          compression-level: 0

  preview-network-install:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/monet-0.9.8-5-vm-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write # GitHub requires push access to read unpublished release assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf qemu-utils python3-pil xorriso squashfs-tools skopeo
          sudo chgrp kvm /dev/kvm
          sudo chmod g+rw /dev/kvm
          sudo usermod -a -G kvm "$USER"
          df -h /
      - name: Download the draft's exact ISO and OCI exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p preview/assets
          gh release download v0.9.8-5 --dir preview/assets --pattern 'Monet-0.9.8-5-Setup.iso' \
            --pattern 'Monet-0.9.8-5-oci.tar.part-*' --pattern 'Monet-0.9.8-5-test-handoff.tar.gz'
      - name: Serve the preview over HTTPS and install in the VM
        run: sg kvm -c 'bash tools/test-preview-network.sh'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preview-network-install
          path: |
            preview/screens/
            preview/vm-work/qemu.log
            preview/vm-work/serial.log
            preview/registry.log
            preview/install.log
