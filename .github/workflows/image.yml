name: Monet OS image

# Builds the full Monet OS image (Bazzite with Monet built in) and pushes it
# to GitHub Packages. Started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Make room (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - name: Build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monet"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          podman build -f image/Containerfile -t "$IMAGE:latest" -t "$IMAGE:$(cat VERSION)" .
      - name: Push
        run: |
          echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:latest"
          podman push "$IMAGE:$(cat VERSION)"
