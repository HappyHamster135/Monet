name: Monet OS

# Builds the Monet OS image (Bazzite with Monet built in), pushes it to
# GitHub Packages, and builds the installer ISO that installs it.
#
# Runs as part of every release, weekly to pick up Bazzite updates, and by
# hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.build.outputs.image }}
      fedora: ${{ steps.build.outputs.fedora }}
    steps:
      - name: Make room (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - name: Build
        id: build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monet"
          VERSION=$(cat VERSION)
          sudo podman build -f image/Containerfile -t "$IMAGE:latest" -t "$IMAGE:$VERSION" .
          FEDORA=$(sudo podman run --rm --entrypoint rpm "$IMAGE:latest" -E %fedora)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "fedora=$FEDORA" >> "$GITHUB_OUTPUT"
          echo "Built $IMAGE $VERSION on Fedora $FEDORA"
      - name: Push
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE:latest"
          sudo podman push "$IMAGE:$(cat VERSION)"

  iso:
    needs: image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the Fedora network installer
        env:
          FEDORA: ${{ needs.image.outputs.fedora }}
        run: |
          for F in "$FEDORA" $((FEDORA - 1)); do
            BASE="https://dl.fedoraproject.org/pub/fedora/linux/releases/$F/Everything/x86_64/iso/"
            NAME=$(curl -fsSL "$BASE" | grep -o "Fedora-Everything-netinst-x86_64-$F-[0-9.]*\.iso" | head -1 || true)
            if [ -n "$NAME" ]; then
              echo "Using $NAME"
              curl -fL --retry 3 -o netinst.iso "$BASE$NAME"
              echo "FEDORA_ISO=$F" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No Fedora network installer found" >&2
          exit 1
      - name: Build the Monet installer
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          VERSION=$(cat VERSION)
          sed "s|@IMAGE@|$IMAGE:latest|" image/monet.ks > monet.ks
          # Add Monet's kickstart, then turn the start menu into Monet's.
          docker run --rm --privileged -v "$PWD:/work" -w /work "registry.fedoraproject.org/fedora:$FEDORA_ISO" bash -ec "
            dnf -y -q install lorax xorriso isomd5sum mtools python3
            mkksiso --ks monet.ks netinst.iso stage.iso
            xorriso -osirrox on -indev stage.iso -extract /EFI/BOOT/grub.cfg efi.cfg -extract /boot/grub2/grub.cfg bios.cfg
            python3 tools/patch-grub.py efi.cfg bios.cfg
            xorriso -indev stage.iso -outdev Monet-$VERSION-Installer.iso -boot_image any replay \
              -update efi.cfg /EFI/BOOT/grub.cfg -update efi.cfg /EFI/BOOT/BOOT.conf -update bios.cfg /boot/grub2/grub.cfg
            # Rewriting the ISO drops its checksum; add it back for \"Test this media\".
            implantisomd5 --force Monet-$VERSION-Installer.iso
            checkisomd5 Monet-$VERSION-Installer.iso
            rm stage.iso
          "
          sudo chown "$(id -u)" "Monet-$VERSION-Installer.iso"
          ls -lh "Monet-$VERSION-Installer.iso"
      - name: Check that Microsoft's Windows download still answers
        # Informational: Microsoft often blocks data centers, so a failure
        # here doesn't mean it fails at home.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import importlib.machinery, importlib.util
          loader = importlib.machinery.SourceFileLoader("pw", "linux/libexec/monet-prepare-windows")
          spec = importlib.util.spec_from_loader("pw", loader)
          pw = importlib.util.module_from_spec(spec)
          loader.exec_module(pw)
          pw.LOG = pw.Path("/tmp/pw.log")
          uri, lang = pw.windows_download_link("English")
          print("Microsoft offered:", lang, uri.split("?")[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: Monet-*-Installer.iso
          compression-level: 0
