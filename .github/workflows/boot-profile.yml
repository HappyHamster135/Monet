name: Development boot timing

# Private runner-local images/disks only. No image push, tag, release, signing key
# or modification of the default branch. The production Secure Boot qualification
# remains separate; these repeatable A/B timings use ordinary OVMF under KVM.
on:
  push:
    branches: [monet-0.9.8-9]
    paths:
      - .github/workflows/boot-profile.yml
      - image/BootProfile.Containerfile
      - image/boot-profile.ignore
      - image/boot/**
      - tools/bench-boot.py
      - tools/boot-profile-package.py
      - tools/boot-profile-podman.py
      - tools/boot-profile-install.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: development-boot-timing
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      BASE: ghcr.io/happyhamster135/monet-amd@sha256:15a82fc9df8aab6b90177e87a686b3ff89a68393c5ecea9c4acb42ae80dd4363
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare the isolated KVM bench
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af >/dev/null
          tools/configure-ci-apt.sh
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf virtiofsd python3-pil podman
          echo "PROFILE_CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')" >> "$GITHUB_ENV"
          echo "PROFILE_BUILD_CPUS=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')" >> "$GITHUB_ENV"
          sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
          sudo test -r /dev/kvm
          sudo test -w /dev/kvm
          mkdir -p target/boot-profile
          # Use current Podman image mounts and pin the runner-only runtime.
          # Neither the Monet image nor the developer's host is changed.
          curl --fail --location --retry 3 https://github.com/containers/crun/releases/download/1.31/crun-1.31-linux-amd64 -o target/boot-profile/crun
          echo '8cacae171bb0e5f9e275adac2eeb2c6ec8c69fdedff7b008eadd8cdd25b0d349  target/boot-profile/crun' | sha256sum -c
          sudo install -m 755 target/boot-profile/crun /usr/local/bin/monet-bench-crun
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime="crun"\n[engine.runtimes]\ncrun=["/usr/local/bin/monet-bench-crun"]\n' | sudo tee /etc/containers/containers.conf.d/99-monet-bench.conf
          /usr/local/bin/monet-bench-crun --version | tee target/boot-profile/toolchain.txt
          podman --version | tee -a target/boot-profile/toolchain.txt
          qemu-system-x86_64 --version | tee -a target/boot-profile/toolchain.txt
          sudo install -m 755 tools/boot-profile-podman.py /usr/local/bin/podman
          curl --fail --location --retry 3 https://github.com/bootc-dev/bcvk/releases/download/v0.22.0/bcvk-x86_64-unknown-linux-gnu.tar.gz -o target/boot-profile/bcvk.tar.gz
          echo 'eb72198c0d36fab75bfcadbb6794a87afa6f496a4da6b1b34d27728243fa6474  target/boot-profile/bcvk.tar.gz' | sha256sum -c
          tar -xzf target/boot-profile/bcvk.tar.gz -C target/boot-profile
          df -h /
      - name: Fetch the digest-verified baseline
        run: |
          sudo taskset -c "$PROFILE_CPU" nice -n 10 podman pull "$BASE"
          sudo taskset -c "$PROFILE_CPU" nice -n 10 podman run --rm --group-add=keep-groups --cap-add=all --security-opt=seccomp=unconfined --entrypoint /bin/true "$BASE"
          # Keep the verified immutable source, but allow the guest's storage
          # copy to change compression without promising the original blob digest.
          sudo podman tag "$BASE" localhost/monet-boot-profile:baseline
      - name: Install the baseline test disk
        timeout-minutes: 25
        run: sudo env GITHUB_ACTIONS=true RUST_LOG=bcvk=debug taskset -c "$PROFILE_BUILD_CPUS" nice -n 10 python3 tools/boot-profile-install.py localhost/monet-boot-profile:baseline target/boot-profile/baseline.qcow2 target/boot-profile/baseline-install
      - name: Measure baseline installed-disk cold boots
        timeout-minutes: 20
        run: |
          sudo taskset -c "$PROFILE_CPU" nice -n 10 python3 tools/bench-boot.py target/boot-profile/baseline.qcow2 target/boot-profile/baseline
          sudo rm target/boot-profile/baseline/working.qcow2 target/boot-profile/baseline.qcow2
      - name: Preserve the baseline before building the candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: boot-baseline-timing
          path: |
            target/boot-profile/baseline/summary.json
            target/boot-profile/baseline/boot-*/*.json
            target/boot-profile/baseline/boot-*/*.txt
            target/boot-profile/baseline/boot-*/*.log
            target/boot-profile/baseline/boot-*/*.png
          retention-days: 14
      - name: Fetch the exact source-matched Linux package
        run: python3 tools/boot-profile-package.py
      - name: Build the development preview without publishing
        run: |
          sudo taskset -c "$PROFILE_BUILD_CPUS" nice -n 10 podman build --ignorefile image/boot-profile.ignore -f image/BootProfile.Containerfile --build-arg BASE="$BASE" --build-arg VERSION="$(cat VERSION)" --build-arg REVISION="$GITHUB_SHA" -t localhost/monet-boot-profile:candidate .
          sudo podman image prune -f
      - name: Install the candidate test disk
        timeout-minutes: 25
        run: sudo env GITHUB_ACTIONS=true RUST_LOG=bcvk=debug taskset -c "$PROFILE_BUILD_CPUS" nice -n 10 python3 tools/boot-profile-install.py localhost/monet-boot-profile:candidate target/boot-profile/candidate.qcow2 target/boot-profile/candidate-install
      - name: Measure candidate installed-disk cold boots
        timeout-minutes: 20
        run: |
          sudo taskset -c "$PROFILE_CPU" nice -n 10 python3 tools/bench-boot.py target/boot-profile/candidate.qcow2 target/boot-profile/candidate
          sudo rm target/boot-profile/candidate/working.qcow2 target/boot-profile/candidate.qcow2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: boot-timing-results
          path: |
            target/boot-profile/*/summary.json
            target/boot-profile/*/boot-*/*.json
            target/boot-profile/*/boot-*/*.txt
            target/boot-profile/*/boot-*/*.log
            target/boot-profile/*/boot-*/*.png
            target/boot-profile/package-source.json
            target/boot-profile/toolchain.txt
            target/boot-profile/*-install/*.txt
            target/boot-profile/*-install/*.log
            target/boot-profile/*-install/*.json
          retention-days: 14
